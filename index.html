<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onda</title>
<meta name="description" content="둘이서 캘린더·기록·버킷리스트·데이트코스·메시지를 실시간으로 공유하는 웹앱">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="shell">
  <div id="topbar">
    <div class="word" id="topbarWord">onda</div>
    <button id="gear" aria-label="설정" onclick="openSettings()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    </button>
  </div>

  <main>
    <section class="panel" id="panel-home"></section>
    <section class="panel" id="panel-calendar"></section>
    <section class="panel" id="panel-record"></section>
    <section class="panel" id="panel-bucket"></section>
    <section class="panel" id="panel-question"></section>
  </main>

  <nav id="nav">
    <div class="nav-brand">🌊 onda</div>
    <button class="navbtn" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      홈
    </button>
    <button class="navbtn" data-tab="calendar" onclick="switchTab('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      캘린더
    </button>
    <button class="navbtn" data-tab="record" onclick="switchTab('record')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h11l3 3V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13.5h8M8 17h5"/></svg>
      기록
    </button>
    <button class="navbtn" data-tab="bucket" onclick="switchTab('bucket')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8.5h16l-1.6 10.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8L4 8.5z"/><path d="M8 8.5V7a4 4 0 0 1 8 0v1.5"/></svg>
      버킷
    </button>
    <button class="navbtn" data-tab="question" onclick="switchTab('question')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-1 .5-1.6 1.2-1.6 2.3"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
      질문
      <span class="dot" id="questionDot" hidden></span>
    </button>
  </nav>

  <aside id="sideWidget" class="side-widget" hidden></aside>
</div>

<button id="chatFab" class="chat-fab" aria-label="메시지 열기" onclick="toggleChat()">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5h16v11H8.5L4 20.5z"/></svg>
  <span class="dot" id="chatDot" hidden></span>
</button>
<div id="chatPanel" class="chat-panel" hidden></div>

<div id="overlayRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0f8f54c86a2a60435df73b6c3a75b2e8&libraries=services&autoload=false"></script>
<script src="config.js"></script>
<script src="db-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
